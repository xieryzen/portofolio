name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Lint & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, curl, zip
          coverage: none

      - name: Lint semua file PHP
        run: |
          set -euo pipefail
          mapfile -t files < <(find app bin lang public views -name '*.php' -o -name 'console' | sort)
          files+=("router.php")
          fail=0
          for file in "${files[@]}"; do
            output=$(php -l "$file" 2>&1) || { echo "$output"; fail=1; }
          done
          [ "$fail" -eq 0 ]
          echo "✔ $((${#files[@]})) file lolos lint"

      - name: Siapkan database & seed
        run: |
          set -euo pipefail
          cp .env.example .env
          php bin/console migrate
          php bin/console user:list
          php bin/console stats

      - name: Uji unit ringan (TOTP & base32)
        run: |
          set -euo pipefail
          php -r '
          require "app/bootstrap.php";
          $raw = random_bytes(20);
          if (App\Totp::base32Decode(App\Totp::base32Encode($raw)) !== $raw) { fwrite(STDERR, "base32 gagal\n"); exit(1); }
          $code = App\Totp::code(App\Totp::generateSecret());
          if (!preg_match("/^\d{6}$/", $code)) { fwrite(STDERR, "kode TOTP tidak valid\n"); exit(1); }
          $secret = App\Totp::generateSecret();
          if (!App\Totp::verify($secret, App\Totp::code($secret))) { fwrite(STDERR, "verifikasi TOTP gagal\n"); exit(1); }
          $hashed = App\Totp::hashRecoveryCodes(["AAAAA-BBBBB"]);
          if (App\Totp::consumeRecoveryCode($hashed, "aaaaabbbbb") === null) { fwrite(STDERR, "kode pemulihan gagal\n"); exit(1); }
          echo "✔ TOTP & kode pemulihan OK\n";
          '

      - name: Uji identitas situs (logo, favicon, banner, upsert profil)
        run: |
          set -euo pipefail
          php -r '
          require "app/bootstrap.php";

          // Upsert: unggah gambar sebelum baris profil ada.
          App\Database::connection()->exec("DELETE FROM profiles");
          App\Models\Profile::setImage("avatar", "uji-avatar.png");
          $profil = App\Models\Profile::get();
          if (($profil["avatar"] ?? null) !== "uji-avatar.png") {
              fwrite(STDERR, "setImage gagal saat profiles kosong\n"); exit(1);
          }

          App\Models\Profile::setImage("cover", "uji-cover.png");
          $profil = App\Models\Profile::get();
          if (($profil["cover"] ?? null) !== "uji-cover.png") {
              fwrite(STDERR, "setImage cover gagal\n"); exit(1);
          }

          App\Settings::set("logo_file", "uji-logo.png");
          App\Settings::set("favicon_file", "uji-favicon.png");
          App\Settings::set("banner_file", "uji-banner.png");
          App\Settings::set("brand_subtitle", "Subjudul uji header");
          App\Settings::flush();

          if (brand_logo() !== app_url("/media/uji-logo.png")) { fwrite(STDERR, "brand_logo salah\n"); exit(1); }
          if (brand_favicon() !== app_url("/media/uji-favicon.png")) { fwrite(STDERR, "brand_favicon salah\n"); exit(1); }
          if (hero_banner() !== app_url("/media/uji-banner.png")) { fwrite(STDERR, "hero_banner salah\n"); exit(1); }
          if (trim(setting("brand_subtitle")) !== "Subjudul uji header") { fwrite(STDERR, "brand_subtitle salah\n"); exit(1); }

          // Logo & favicon dipaksa persegi 1:1, avatar/cover tidak.
          if (function_exists("imagecreatetruecolor")) {
              $wide = imagecreatetruecolor(300, 100);
              imagefilledrectangle($wide, 0, 0, 299, 99, imagecolorallocate($wide, 40, 90, 200));
              imagepng($wide, "/tmp/wide-logo.png");
              imagedestroy($wide);

              $fake = [
                  "error" => UPLOAD_ERR_OK,
                  "size" => filesize("/tmp/wide-logo.png"),
                  "tmp_name" => "/tmp/wide-logo.png",
                  "name" => "wide-logo.png",
              ];
              $hasil = App\Uploader::image($fake, "logo");
              if (($hasil["ok"] ?? false) !== true) { fwrite(STDERR, "unggah logo gagal: " . ($hasil["error"] ?? "-") . "\n"); exit(1); }
              $logoPath = App\Uploader::directory() . "/" . $hasil["file"];
              $dim = getimagesize($logoPath);
              if (($dim[0] ?? 0) !== 512 || ($dim[1] ?? 0) !== 512) {
                  fwrite(STDERR, "logo tidak persegi 512x512: " . ($dim[0] ?? 0) . "x" . ($dim[1] ?? 0) . "\n");
                  exit(1);
              }
              if (!str_ends_with((string) $hasil["file"], ".png")) { fwrite(STDERR, "logo persegi harus PNG\n"); exit(1); }
              @unlink($logoPath);

              $wide2 = imagecreatetruecolor(300, 100);
              imagefilledrectangle($wide2, 0, 0, 299, 99, imagecolorallocate($wide2, 200, 90, 40));
              imagepng($wide2, "/tmp/wide-avatar.png");
              imagedestroy($wide2);
              $fakeAvatar = [
                  "error" => UPLOAD_ERR_OK,
                  "size" => filesize("/tmp/wide-avatar.png"),
                  "tmp_name" => "/tmp/wide-avatar.png",
                  "name" => "wide-avatar.png",
              ];
              $avatarHasil = App\Uploader::image($fakeAvatar, "avatar");
              if (($avatarHasil["ok"] ?? false) !== true) { fwrite(STDERR, "unggah avatar gagal\n"); exit(1); }
              $avatarPath = App\Uploader::directory() . "/" . $avatarHasil["file"];
              $avatarDim = getimagesize($avatarPath);
              if (($avatarDim[0] ?? 0) === ($avatarDim[1] ?? 1)) { fwrite(STDERR, "avatar tidak boleh dipaksa persegi\n"); exit(1); }
              @unlink($avatarPath);

              echo "✔ logo dipaksa persegi 512x512, avatar tetap mengikuti rasio\n";
          } else {
              echo "! GD tidak tersedia, uji persegi dilewati\n";
          }

          App\Settings::set("logo_file", "");
          App\Settings::flush();
          if (brand_logo() !== null) { fwrite(STDERR, "brand_logo harus null saat kosong\n"); exit(1); }
          App\Settings::set("logo_file", "uji-logo.png");
          App\Settings::flush();
          echo "✔ upsert profil + helper identitas situs OK\n";
          '

      - name: Smoke test HTTP
        run: |
          set -euo pipefail

          php -S 127.0.0.1:8080 -t public router.php > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 0.5
          done

          check() {
            local url="$1" needle="$2"
            local code
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "✖ $url → HTTP $code"
              head -40 /tmp/body
              exit 1
            fi
            if ! grep -q "$needle" /tmp/body; then
              echo "✖ $url tidak memuat: $needle"
              exit 1
            fi
            echo "✔ $url"
          }

          expect_in_home() {
            local needle="$1" body
            body=$(curl -sS http://127.0.0.1:8080/)
            if ! printf '%s' "$body" | grep -q -- "$needle"; then
              echo "✖ Halaman depan tidak memuat: $needle"
              exit 1
            fi
            echo "✔ halaman depan memuat: $needle"
          }

          check "http://127.0.0.1:8080/" "Karya pilihan"
          check "http://127.0.0.1:8080/?lang=en" "Selected work"
          check "http://127.0.0.1:8080/login" "Masuk"
          check "http://127.0.0.1:8080/offline" "Mode offline"
          check "http://127.0.0.1:8080/blog" "catatan"
          check "http://127.0.0.1:8080/blog?lang=en" "Articles"
          check "http://127.0.0.1:8080/feed.xml" "<rss"
          check "http://127.0.0.1:8080/sitemap.xml" "<urlset"
          check "http://127.0.0.1:8080/robots.txt" "Sitemap"
          check "http://127.0.0.1:8080/manifest.webmanifest" "start_url"

          expect_in_home "uji-logo.png"
          expect_in_home "uji-favicon.png"
          expect_in_home "uji-banner.png"
          expect_in_home "hero has-banner"
          expect_in_home "Subjudul uji header"

          # Tanpa pengaturan kustom, situs wajib memakai aset identitas bawaan.
          php -r 'require "app/bootstrap.php";
            App\Settings::set("logo_file", "");
            App\Settings::set("favicon_file", "");
            App\Settings::set("banner_file", "");
            App\Settings::set("brand_subtitle", "");
            App\Settings::flush();'
          expect_in_home "icons/logo-xiero-512.png"
          expect_in_home "icons/favicon-32.png"
          expect_in_home "assets/img/hero-banner.jpg"

          slug=$(php -r 'require "app/bootstrap.php"; $items = App\Models\Project::published(1); echo $items[0]["slug"] ?? "";')
          if [ -n "$slug" ]; then
            check "http://127.0.0.1:8080/project/$slug" "Tentang project"
            check "http://127.0.0.1:8080/project/$slug?lang=en" "About the project"
          fi

          admin_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin)
          if [ "$admin_code" != "302" ]; then
            echo "✖ /admin seharusnya redirect ke login, dapat HTTP $admin_code"
            exit 1
          fi
          echo "✔ /admin terlindungi (302)"

          if grep -qiE "PHP (Warning|Fatal error|Parse error)|Uncaught" server.log; then
            echo "✖ Ada error PHP di server log:"
            cat server.log
            exit 1
          fi
          echo "✔ Tidak ada warning/fatal di server log"
