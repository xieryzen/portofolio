          fi

      - name: Login, unggah gambar uji, periksa hasil
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          DIR="/var/lib/pterodactyl/volumes/2ed93f7b-4009-4eaa-814c-577dee40dd3b"
          CID="$(docker ps -q --filter name=2ed93f7b 2>/dev/null | head -n 1)"
          echo "=HOST uploads=$(ls -1 "$DIR/storage/uploads" 2>/dev/null | wc -l) dokumen=$(ls -1 "$DIR/storage/documents" 2>/dev/null | wc -l)"
          EM="$(grep -E '^OWNER_EMAIL=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r"')"
          PW="$(grep -E '^OWNER_PASSWORD=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r"')"
          BASE="https://portofolio.xiero.biz.id"
          printf 'iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAHUlEQVR42u3OMQEAAAgDoC251a3gLwSgSZMmTZr0zwEBAQH/0kR9AAAAAElFTkSuQmCC' | base64 -d > /tmp/uji.png
          echo "=PNG $(stat -c %s /tmp/uji.png) byte"
          JAR="$(mktemp)"
          T1="$(curl -fsS -c "$JAR" "$BASE/login" | grep -o 'name="_token" value="[^"]*"' | head -n 1 | sed -E 's/.*value="//; s/"$//')"
          curl -s -o /dev/null -b "$JAR" -c "$JAR" -X POST "$BASE/login" \
            --data-urlencode "_token=$T1" --data-urlencode "email=$EM" --data-urlencode "password=$PW"
          PAGE="$(curl -s -b "$JAR" -c "$JAR" "$BASE/admin/profile")"
          echo "=HALAMAN profil=${#PAGE} byte"
          T2="$(printf '%s' "$PAGE" | grep -o 'name="_token" value="[^"]*"' | head -n 1 | sed -E 's/.*value="//; s/"$//')"
          CODE="$(curl -s -o /tmp/resp.html -w '%{http_code}' -b "$JAR" -c "$JAR" -X POST "$BASE/admin/profile/image" \
            -F "_token=$T2" -F "type=avatar" -F "image=@/tmp/uji.png;type=image/png")"
          echo "=UPLOAD http=$CODE"
          FLASH="$(curl -s -b "$JAR" "$BASE/admin/profile" | tr '\n' ' ' | grep -oE '(alert|flash)[^<]{0,20}<[^>]*>[^<]{3,140}' | head -n 2 | tr '\n' ' | ')"
          echo "=FLASH ${FLASH:-<tidak terdeteksi>}"
          echo "=DB $(docker exec "$CID" php -r '$d=new PDO("sqlite:storage/database.sqlite"); $r=$d->query("SELECT avatar, cover FROM profiles LIMIT 1")->fetch(PDO::FETCH_ASSOC); echo "avatar=".($r["avatar"]?:"<kosong>")." cover=".($r["cover"]?:"<kosong>");' 2>&1 | head -1)"
          AV="$(docker exec "$CID" php -r '$d=new PDO("sqlite:storage/database.sqlite"); echo (string) $d->query("SELECT avatar FROM profiles LIMIT 1")->fetchColumn();' 2>&1 | head -1)"
          if [ -n "$AV" ]; then
            echo "=MEDIA $(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/media/$AV")"
          fi
          # Unggah cover (banner) + CV PDF.
          CODE2="$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -c "$JAR" -X POST "$BASE/admin/profile/image" \
            -F "_token=$T2" -F "type=cover" -F "image=@/tmp/uji.png;type=image/png")"
          printf '%%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%%%EOF\n' > /tmp/uji.pdf
          CODE3="$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -c "$JAR" -X POST "$BASE/admin/profile/cv" \
            -F "_token=$T2" -F "cv=@/tmp/uji.pdf;type=application/pdf")"
          echo "=COVER http=$CODE2 (302=sukses)"
          echo "=CVUPLOAD http=$CODE3 (302=sukses)|/cv=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/cv")"
          HOME_HTML="$(curl -s "$BASE/")"
          echo "=HOME mxn-avatar=$(printf '%s' "$HOME_HTML" | grep -o 'media/[A-Za-z0-9._-]*' | head -3 | tr '\n' ' ')"
          echo "=DIRBANDING $(docker inspect -f '{{range .Mounts}}{{.Source}}->{{.Destination}} {{end}}' "$CID" 2>/dev/null | cut -c1-200)"
          echo "=CMD1 $(docker exec "$CID" sh -c 'tr "\\0" " " < /proc/1/cmdline' 2>&1 | cut -c1-400)"
          # Bersihkan berkas uji supaya tidak tampil di situs pengguna.
          for T in avatar cover; do
            curl -s -o /dev/null -b "$JAR" -c "$JAR" -X POST "$BASE/admin/profile/image/remove" -d "_token=$T2" -d "type=$T"
          done
          curl -s -o /dev/null -b "$JAR" -c "$JAR" -X POST "$BASE/admin/profile/cv/delete" -d "_token=$T2"
          echo "=SISA $(docker exec "$CID" php -r '$d=new PDO("sqlite:storage/database.sqlite"); $r=$d->query("SELECT avatar, cover FROM profiles LIMIT 1")->fetch(PDO::FETCH_ASSOC); $cv=$d->query("SELECT setting_value FROM settings WHERE setting_key=\"cv_file\"")->fetchColumn(); echo "avatar=".($r["avatar"]?:"kosong")." cover=".($r["cover"]?:"kosong")." cv=".($cv ?: "kosong");' 2>&1 | head -1)"
          rm -f "$JAR" /tmp/uji.png /tmp/uji.pdf /tmp/resp.html
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =SISA*) echo "::notice title=Bersih::${line#=}";;
              =HOST*|=PNG*|=HALAMAN*|=UPLOAD*|=FLASH*|=DB*|=MEDIA*|=COVER*|=CVUPLOAD*|=HOME*) echo "::notice title=Uji::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          exit 0

  # ----------------------------------------------------------- uji-brand ----
  uji-brand:
    name: Uji logo, favicon & banner
    if: inputs.tugas == 'uji-brand'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Unggah, periksa tampilan, lalu bersihkan
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          DIR="/var/lib/pterodactyl/volumes/2ed93f7b-4009-4eaa-814c-577dee40dd3b"
          CID="$(docker ps -q --filter name=2ed93f7b 2>/dev/null | head -n 1)"
          EM="$(grep -E '^OWNER_EMAIL=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r"')"
          PW="$(grep -E '^OWNER_PASSWORD=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r"')"
          BASE="https://portofolio.xiero.biz.id"
          # Gambar uji sengaja TIDAK persegi (160x60) untuk membuktikan logo dipaksa 1:1.
          docker exec "$CID" php -r '$im=imagecreatetruecolor(160,60); imagefilledrectangle($im,0,0,159,59,imagecolorallocate($im,60,120,220)); imagepng($im,"/home/container/.uji-lebar.png");' 2>/dev/null
          if [ -f "$DIR/.uji-lebar.png" ]; then cp "$DIR/.uji-lebar.png" /tmp/brand.png; fi
          [ -f /tmp/brand.png ] || printf 'iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAHUlEQVR42u3OMQEAAAgDoC251a3gLwSgSZMmTZr0zwEBAQH/0kR9AAAAAElFTkSuQmCC' | base64 -d > /tmp/brand.png
          DIMASAL="$(docker exec "$CID" php -r 'if (function_exists("getimagesize")) { $d=getimagesize("/home/container/.uji-lebar.png"); echo $d ? $d[0]."x".$d[1] : "?"; }' 2>/dev/null | head -1)"
          echo "=UKURANASAL ${DIMASAL:-?}"
          JAR="$(mktemp)"
          T1="$(curl -fsS -c "$JAR" "$BASE/login" | grep -o 'name="_token" value="[^"]*"' | head -n 1 | sed -E 's/.*value="//; s/"$//')"
          curl -s -o /dev/null -b "$JAR" -c "$JAR" -X POST "$BASE/login" \
            --data-urlencode "_token=$T1" --data-urlencode "email=$EM" --data-urlencode "password=$PW"
          T2="$(curl -s -b "$JAR" "$BASE/admin/settings" | grep -o 'name="_token" value="[^"]*"' | head -n 1 | sed -E 's/.*value="//; s/"$//')"
          echo "=TOKEN $([ -n "$T2" ] && echo ada || echo tidak-ada)"
          for T in logo favicon banner; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -c "$JAR" -X POST "$BASE/admin/settings/brand" \
              -F "_token=$T2" -F "type=$T" -F "image=@/tmp/brand.png;type=image/png")"
            echo "=UNGGAH $T http=$CODE"
          done
          SET="$(docker exec "$CID" php -r '$d=new PDO("sqlite:storage/database.sqlite"); $o=[]; foreach ($d->query("SELECT setting_key, setting_value FROM settings WHERE setting_key IN ("logo_file","favicon_file","banner_file")") as $r) { $o[$r[0]]=$r[1]; } echo json_encode($o);' 2>&1 | head -1)"
          echo "=DB $SET"
          HOME_HTML="$(curl -s "$BASE/")"
          for T in logo favicon banner; do
            F="$(printf '%s' "$SET" | sed -E "s/.*\"${T}_file\":\"([^\"]*)\".*/\1/")"
            if [ -z "$F" ]; then echo "=BERKAS $T kosong"; continue; fi
            DIM="$(docker exec "$CID" php -r '$d=getimagesize("/home/container/storage/uploads/" . $argv[1]); echo $d ? $d[0]."x".$d[1] : "?";' "$F" 2>/dev/null | head -1)"
            echo "=BERKAS $T=$F|$DIM|media=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/media/$F")|di-header=$(printf '%s' "$HOME_HTML" | grep -c "media/$F")"
          done
          echo "=BANNERKELAS $(printf '%s' "$HOME_HTML" | grep -c 'hero has-banner')"
          echo "=SUBTITLE $(printf '%s' "$HOME_HTML" | grep -o 'class="brand-name".\{0,160\}' | head -1 | tr -d '\n' | cut -c1-160)"
          for T in logo favicon banner; do
            curl -s -o /dev/null -b "$JAR" -c "$JAR" -X POST "$BASE/admin/settings/brand/remove" -d "_token=$T2" -d "type=$T"
          done
          SISA="$(docker exec "$CID" php -r '$d=new PDO("sqlite:storage/database.sqlite"); $n=0; foreach ($d->query("SELECT setting_value FROM settings WHERE setting_key IN ("logo_file","favicon_file","banner_file")") as $r) { if (trim((string)$r[0])!=="") $n++; } echo $n;' 2>&1 | head -1)"
          echo "=BERSIH sisa-nonaktif=$SISA"
          rm -f "$JAR" /tmp/brand.png "$DIR/.uji-lebar.png"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =UKURANASAL*|=BERKAS*|=BERSIH*|=UNGGAH*|=TOKEN*) echo "::notice title=Identitas::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          exit 0

  # --------------------------------------------------------------- orphan ----
  orphan:
    name: Volume tanpa server di panel
    if: inputs.tugas == 'orphan'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      MODE: ${{ startsWith(inputs.konfirmasi, 'HAPUS') && 'hapus' || 'laporan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Bandingkan volume dengan daftar server
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $MODE" <<'REMOTE' 2>&1
          set -u
          MODE="$1"
          if [ ! -f /var/www/pterodactyl/.env ]; then echo "=GAGAL .env panel tidak ada"; exit 1; fi
          PHPBIN="$(command -v php || true)"
          [ -n "$PHPBIN" ] || { echo "=GAGAL php CLI tidak ada"; exit 1; }
          cat > /tmp/uuids.php <<'PHP'
          <?php
          $env = [];
          foreach (file('/var/www/pterodactyl/.env', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {
              if (!preg_match('/^\s*([A-Za-z0-9_]+)\s*=\s*(.*)$/', $line, $m)) { continue; }
              $v = trim($m[2]); $len = strlen($v);
              if ($len >= 2 && (($v[0] === '"' && $v[$len-1] === '"') || ($v[0] === "'" && $v[$len-1] === "'"))) { $v = substr($v, 1, -1); }
              $env[$m[1]] = $v;
          }
          $host = $env['DB_HOST'] ?? '127.0.0.1';
          if (in_array($host, ['localhost', '127.0.0.1'], true)) { $host = '127.0.0.1'; }
          $pdo = new PDO(sprintf('mysql:host=%s;port=%s;dbname=%s', $host, $env['DB_PORT'] ?? '3306', $env['DB_DATABASE'] ?? 'panel'),
                         $env['DB_USERNAME'] ?? 'pterodactyl', $env['DB_PASSWORD'] ?? '',
                         [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          foreach ($pdo->query('SELECT uuid, name FROM servers') as $r) {
              echo $r['uuid'], '|', $r['name'], "\n";
          }
          PHP
          "$PHPBIN" /tmp/uuids.php > /tmp/servers.txt 2>/tmp/uuids.err || { echo "=GAGAL query DB: $(tail -1 /tmp/uuids.err)"; exit 1; }
          cut -d'|' -f1 /tmp/servers.txt | sort -u > /tmp/uuids.txt
          echo "=DB $(wc -l < /tmp/uuids.txt) server terdaftar di panel"
          echo "=VOL $(find /var/lib/pterodactyl/volumes -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l) folder volume"
          found=0
          for d in /var/lib/pterodactyl/volumes/*/; do
            [ -d "$d" ] || continue
            u="$(basename "$d")"
            grep -qx "$u" /tmp/uuids.txt && continue
            found=$((found + 1))
            sz="$(du -sh "$d" 2>/dev/null | cut -f1)"
            if [ "$MODE" = "hapus" ]; then
              case "$d" in /var/lib/pterodactyl/volumes/*) ;; *) continue ;; esac
              if ! grep -qx "$u" /tmp/uuids.txt; then
                if rm -rf -- "$d"; then echo "=HAPUS $sz|$u"; else echo "=GAGAL hapus $u"; fi
              fi
            else
              echo "=ORPHAN $sz|$u"
            fi
          done
          echo "=JUMLAH $found volume tanpa server"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =ORPHAN*|=HAPUS*) echo "::notice title=Item::${line#=}";;
              =DB*|=VOL*|=JUMLAH*) echo "::notice title=Info::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # -------------------------------------------------------------- bersih ----
  bersih:
    name: Bersih-bersih VPS
    if: inputs.tugas == 'bersih-laporan' || inputs.tugas == 'bersih-hapus'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY) di Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Validasi konfirmasi
        if: inputs.tugas == 'bersih-hapus' && inputs.konfirmasi != 'BERSIHKAN'
        run: |
          echo "::error::Tugas bersih-hapus butuh isian konfirmasi = BERSIHKAN"
          exit 1

      - name: Jalankan cleanup-vps.sh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          MODE: ${{ inputs.tugas }}
        run: |
          set -uo pipefail
          args=""
          [ "$MODE" = "bersih-hapus" ] && args="--apply"
          if [ "${VPS_USER}" = "root" ]; then
            out="$(bash deploy/gha-ssh.sh "bash -s -- $args" < deploy/cleanup-vps.sh 2>&1)" || true
          else
            out="$(bash deploy/gha-ssh.sh "sudo -n bash -s -- $args" < deploy/cleanup-vps.sh 2>&1)" || true
          fi
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              *"Ringkasan /tmp"*|*"Ringkasan /var/tmp"*|*"Ukuran sekarang"*|*"Image dangling"*|*"Pemakaian"*|*"volumes :"*|*"backups :"*|*"Jumlah folder backup"*|*"SELESAI"*|*"LAPORAN"*)
                n=$((n+1)); [ "$n" -le 12 ] && echo "::notice title=Cleanup::$(echo "$line" | sed 's/^[0-9-]* [0-9:]* //')" ;;
            esac
          done <<< "$out"
          if echo "$out" | grep -q "GAGAL"; then
            echo "::warning title=Cleanup::ada langkah yang gagal, lihat log"
          fi
          exit 0

  # --------------------------------------------------------- deploy-panel ----
  deploy:
    name: Deploy lewat API panel
    if: inputs.tugas == 'deploy-panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan panel-deploy.sh
        env:
          PTERO_PANEL_URL: ${{ secrets.PTERO_PANEL_URL || 'https://panel.hexnitystore.com' }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${PTERO_SERVER_ID:-}" ] || [ -z "${PTERO_API_KEY:-}" ]; then
            echo "::error::Tambahkan secret PTERO_SERVER_ID dan PTERO_API_KEY."
            exit 1
          fi
          args=()
          [ -n "${TAG:-}" ] && args+=("--tag" "$TAG")
          bash deploy/panel-deploy.sh "${args[@]}"
