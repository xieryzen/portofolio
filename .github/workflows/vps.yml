name: VPS

# Menjalankan tugas di VPS dari infrastruktur GitHub (punya akses internet penuh).
# Berguna saat mesin lokal/agen tidak bisa menjangkau IP VPS.
#
# Sekali saja, tambahkan secrets di: Settings → Secrets and variables → Actions
#   VPS_HOST          (opsional, default 38.47.92.214)
#   VPS_USER          (opsional, default root)
#   VPS_SSH_KEY       kunci privat SSH (disarankan) ATAU
#   VPS_SSH_PASSWORD  kata sandi SSH (fallback)
#   PTERO_SERVER_ID   UUID server panel (default: server Xiero Portofolio)
#   PTERO_API_KEY     API key panel (Client API, read & write)
#
# Hasil penting dikirim sebagai anotasi (::notice:: / ::error::) sehingga bisa
# dibaca lewat API tanpa mengunduh log:
#   gh api repos/<owner>/<repo>/check-runs/<job-id>/annotations
#
# Jangan pernah menaruh kredensial di file repo atau di chat.

on:
  workflow_dispatch:
    inputs:
      tugas:
        description: 'Tugas yang dijalankan'
        required: true
        default: cek
        type: choice
        options:
          - cek
          - info
          - deploy-ssh
          - panel-start
          - logs
          - web-setup
          - fix-startup
          - start-server
          - smoke
          - bkp
          - bkp-hapus
          - bkp-luar-hapus
          - kredensial
          - akun
          - akun-ubah
          - diagnosa
          - uji-upload
          - uji-brand
          - orphan
          - bersih-laporan
          - bersih-hapus
          - deploy-panel
      konfirmasi:
        description: 'Ketik BERSIHKAN atau DEPLOY untuk tugas yang butuh konfirmasi'
        required: false
        default: ''
        type: string
      tag:
        description: 'Tag rilis (kosong = terbaru)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- cek ----
  # Setiap titik uji adalah job terpisah agar lulus/gagalnya terlihat jelas.
  cek-dns:
    name: Cek DNS
    if: inputs.tugas == 'cek'
    runs-on: ubuntu-latest
    steps:
      - name: Resolusi domain panel & situs
        run: |
          ok=1
          for host in panel.hexnitystore.com portofolio.xiero.biz.id; do
            ip="$(getent hosts "$host" | awk '{print $1}' | head -1)"
            if [ -n "$ip" ]; then
              echo "$host -> $ip"
              echo "::notice title=DNS::$host -> $ip"
            else
              echo "::error title=DNS gagal::$host tidak ter-resolve"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

  cek-port22:
    name: Cek port 22
    if: inputs.tugas == 'cek'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
    steps:
      - run: timeout 10 bash -c 'exec 3<>/dev/tcp/'"$VPS_HOST"'/22' && echo "port 22 terbuka"

  cek-port80:
    name: Cek port 80
    if: inputs.tugas == 'cek'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
    steps:
      - run: timeout 10 bash -c 'exec 3<>/dev/tcp/'"$VPS_HOST"'/80' && echo "port 80 terbuka"

  cek-port443:
    name: Cek port 443
    if: inputs.tugas == 'cek'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
    steps:
      - run: timeout 10 bash -c 'exec 3<>/dev/tcp/'"$VPS_HOST"'/443' && echo "port 443 terbuka"

  cek-ssh:
    name: Cek banner SSH
    if: inputs.tugas == 'cek'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
    steps:
      - name: Baca banner
        run: |
          banner="$(timeout 12 bash -c 'exec 3<>/dev/tcp/'"$VPS_HOST"'/22; head -c 60 <&3' | tr -d '\000' || true)"
          echo "banner: ${banner:-<kosong>}"
          case "$banner" in
            SSH-*) echo "::notice title=SSH::$banner" ; exit 0 ;;
            *) echo "::error title=SSH gagal::banner tidak diterima" ; exit 1 ;;
          esac

  cek-web:
    name: Cek panel & situs
    if: inputs.tugas == 'cek'
    runs-on: ubuntu-latest
    steps:
      - name: Panel HTTPS
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' https://panel.hexnitystore.com 2>/dev/null || true)"
          echo "panel -> HTTP ${code:-000}"
          case "${code:-000}" in
            2*|3*) echo "::notice title=Panel::HTTP $code" ;;
            *) echo "::error title=Panel gagal::HTTP ${code:-000}" ; exit 1 ;;
          esac

      - name: Situs portofolio
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' https://portofolio.xiero.biz.id 2>/dev/null || true)"
          echo "situs -> HTTP ${code:-000}"
          case "${code:-000}" in
            2*|3*) echo "::notice title=Situs::HTTP $code" ;;
            *) echo "::error title=Situs gagal::HTTP ${code:-000}" ; exit 1 ;;
          esac

  # --------------------------------------------------------------- info ----
  info:
    name: Info server (baca saja)
    if: inputs.tugas == 'info'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY) di Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Kumpulkan informasi
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $SERVER_ID" <<'REMOTE' 2>&1
          set -u
          SERVER_ID="$1"
          . /etc/os-release 2>/dev/null || true
          echo "=OS ${PRETTY_NAME:-?} (kernel $(uname -r))"
          echo "=UPTIME $(uptime -p 2>/dev/null || uptime)"
          echo "=DISK $(df -h / | awk 'NR==2{print $3" terpakai dari "$2" ("$5")"}')"
          echo "=MEM $(free -m 2>/dev/null | awk 'NR==2{print $3" MB / "$2" MB"}')"
          echo "=DOCKER $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo tidak-ada)"
          echo "=WINGS $(systemctl is-active wings 2>/dev/null || echo tidak-ada)"
          echo "=PANEL_DIR $( [ -d /var/www/pterodactyl ] && echo ada || echo tidak )"
          VOL="/var/lib/pterodactyl/volumes/$SERVER_ID"
          echo "=SERVER_DIR $( [ -d "$VOL" ] && echo "ada ($(du -sh "$VOL" 2>/dev/null | cut -f1))" || echo tidak )"
          if [ -d "$VOL" ]; then
            echo "=ISI $(ls -A "$VOL" 2>/dev/null | head -10 | tr '\n' ' ')"
            echo "=START_SH $( [ -f "$VOL/start.sh" ] && echo ada || echo tidak )"
            echo "=DATABASE $( [ -f "$VOL/storage/database.sqlite" ] && echo ada || echo tidak )"
            echo "=ENV $( [ -f "$VOL/.env" ] && echo ada || echo tidak )"
          fi
          echo "=CONTAINER $(docker ps -a --format '{{.Names}}|{{.Status}}' 2>/dev/null | grep -F "$SERVER_ID" | head -1)"
          echo "=NGINX $(ls /etc/nginx/sites-enabled 2>/dev/null | tr '\n' ' ')"
          echo "=CERT $( [ -d /etc/letsencrypt/live/portofolio.xiero.biz.id ] && echo ada || echo tidak )"
          echo "=PORT_PANEL $(ss -ltn 2>/dev/null | awk 'NR>1{print $4}' | sed 's/.*://' | sort -un | head -12 | tr '\n' ' ')"
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*)
                n=$((n+1))
                [ "$n" -le 14 ] && echo "::notice title=Info::${line#=}"
                ;;
            esac
          done <<< "$out"
          exit 0

  # --------------------------------------------------------- deploy-ssh ----
  deploy-ssh:
    name: Deploy ke volume panel (SSH)
    if: inputs.tugas == 'deploy-ssh'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY) di Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Validasi konfirmasi
        if: inputs.konfirmasi != 'DEPLOY'
        run: |
          echo "::error::Tugas deploy-ssh butuh isian konfirmasi = DEPLOY"
          exit 1

      - name: Tentukan tag rilis
        id: rilis
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            # gh memakai token Actions (kuota API jauh lebih besar daripada tanpa token).
            tag="$(GH_TOKEN="${{ github.token }}" gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            tag="$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
                   | python3 -c 'import json,sys;print((json.load(sys.stdin) or {}).get("tag_name",""))' 2>/dev/null || true)"
          fi
          [ -n "$tag" ] || { echo "::error::Tidak bisa menentukan tag rilis"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice title=Rilis::$tag"

      - name: Unduh & ekstrak ke volume server
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          TAG="${{ steps.rilis.outputs.tag }}"
          out="$(bash deploy/gha-ssh.sh "bash -s -- $TAG $SERVER_ID" <<'REMOTE' 2>&1
          set -u
          TAG="$1"; UUID="$2"
          BASE="/var/lib/pterodactyl/volumes/$UUID"
          ZIP="portofolio-$TAG.zip"
          URL="https://github.com/xieryzen/portofolio/releases/download/$TAG/$ZIP"
          echo "=DIR $BASE"
          if [ ! -d "$BASE" ]; then echo "=GAGAL volume server tidak ditemukan"; exit 1; fi
          echo "=UNDUH $URL"
          if ! curl -fsSL --retry 3 -o "/tmp/$ZIP" "$URL"; then echo "=GAGAL unduh paket"; exit 1; fi
          echo "=OK unduh $(du -h "/tmp/$ZIP" | cut -f1)"
          if ! unzip -q -o "/tmp/$ZIP" -d "$BASE"; then echo "=GAGAL ekstrak"; exit 1; fi
          rm -f "/tmp/$ZIP"
          echo "=OK ekstrak ke volume"
          if [ -f "$BASE/start.sh" ]; then echo "=OK start.sh ada"; else echo "=GAGAL start.sh tidak ada"; fi
          if [ -f "$BASE/storage/database.sqlite" ]; then echo "=OK database lama dipertahankan"; else echo "=INFO database belum ada (instalasi baru)"; fi
          NAME="$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep -F "$UUID" | head -1)"
          if [ -n "$NAME" ]; then
            USR="$(docker inspect -f '{{.Config.User}}' "$NAME" 2>/dev/null)"
            echo "=CONTAINER $NAME (user=${USR:-default})"
            if [ -n "$USR" ] && [ "$USR" != "root" ]; then
              chown -R "$USR" "$BASE" 2>/dev/null && echo "=OK chown $USR"
            fi
            chmod -R 775 "$BASE/storage" 2>/dev/null && echo "=OK chmod storage"
            if docker restart "$NAME" >/dev/null 2>&1; then echo "=OK container direstart"; else echo "=GAGAL restart container"; fi
          else
            U="$(id -u pterodactyl 2>/dev/null || echo 988)"
            chown -R "$U:$U" "$BASE" 2>/dev/null && echo "=OK chown $U:$U"
            chmod -R 775 "$BASE/storage" 2>/dev/null && echo "=OK chmod storage"
            echo "=INFO container belum ada — perlu Start"
          fi
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*) n=$((n+1)); [ "$n" -le 14 ] && echo "::notice title=Deploy::${line#=}" ;;
            esac
          done <<< "$out"
          if echo "$out" | grep -q '^=GAGAL'; then
            echo "::error title=Deploy::ada langkah yang gagal"
            exit 1
          fi

      - name: Cek situs dari runner
        if: always()
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' https://portofolio.xiero.biz.id 2>/dev/null || true)"
          echo "situs -> HTTP ${code:-000}"
          case "${code:-000}" in
            2*|3*) echo "::notice title=Situs::HTTP $code" ;;
            *) echo "::warning title=Situs::HTTP ${code:-000} — domain/SSL belum siap, cek nginx+certbot" ;;
          esac

  # ----------------------------------------------------------------- logs ----
  logs:
    name: Log container server
    if: inputs.tugas == 'logs'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Ambil status & log
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $SERVER_ID" <<'REMOTE' 2>&1
          set -u
          UUID="$1"
          NAME="$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep -F "$UUID" | head -1)"
          if [ -z "$NAME" ]; then echo "=GAGAL container tidak ditemukan"; exit 1; fi
          IMG="$(docker inspect -f '{{.Config.Image}}' "$NAME" 2>/dev/null)"
          echo "=MODS $(docker run --rm --entrypoint php "$IMG" -m 2>/dev/null | grep -E 'sqlite|pdo|gd|mbstring|curl|zip|fileinfo' | tr '\n' ',' || echo tidak-bisa)"
          echo "=BASH $(docker run --rm --entrypoint sh "$IMG" -c 'command -v bash || echo tidak-ada' 2>/dev/null || echo tidak-bisa)"
          docker logs --tail 80 "$NAME" 2>&1 | grep -v '^$' | tail -8 | sed 's/^/=LOG /'
          echo "=CONTAINER $NAME"
          echo "=STATE $(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' "$NAME" 2>/dev/null)"
          echo "=IMAGE $(docker inspect -f '{{.Config.Image}}' "$NAME" 2>/dev/null)"
          echo "=PORTENV $(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$NAME" 2>/dev/null | grep -E 'SERVER_PORT|SERVER_IP' | tr '\n' ' ')"
          echo "=VOLENV $(ls -A "/var/lib/pterodactyl/volumes/$UUID" 2>/dev/null | tr '\n' ' ')"
          echo "=ENTRY $(docker inspect -f '{{json .Config.Entrypoint}}' "$NAME" 2>/dev/null)"
          echo "=CMD $(docker inspect -f '{{json .Config.Cmd}}' "$NAME" 2>/dev/null)"
          echo "=STARTUP_IN_DB $(mysql -N -B -e "select startup from pterodactyl.servers where uuid='$UUID'" 2>/dev/null || echo tidak-bisa-query)"
          echo "=IMAGE_IN_DB $(mysql -N -B -e "select image from pterodactyl.servers where uuid='$UUID'" 2>/dev/null || echo tidak-bisa-query)"
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*) n=$((n+1)); [ "$n" -le 14 ] && echo "::notice title=Log::${line#=}" ;;
            esac
          done <<< "$out" || true
          exit 0

  # ---------------------------------------------------------- panel-start ----
  panel-start:
    name: Start server di panel (artisan)
    if: inputs.tugas == 'panel-start'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Perintahkan start lewat artisan
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $SERVER_ID" <<'REMOTE' 2>&1
          set -u
          UUID="$1"
          ART=/var/www/pterodactyl/artisan
          if [ ! -f "$ART" ]; then echo "=GAGAL artisan tidak ditemukan"; exit 1; fi
          cd /var/www/pterodactyl || exit 1
          CMDS="$(php artisan list --raw 2>/dev/null | awk '{print $1}' | grep -E '^p:server' | tr '\n' ' ')"
          echo "=CMDS ${CMDS:-tidak-ada}"
          if echo "$CMDS" | grep -q 'p:server:bulk-power'; then
            if php artisan p:server:bulk-power start "$UUID" >/tmp/power.log 2>&1; then
              echo "=OK bulk-power start"
            else
              echo "=GAGAL bulk-power: $(tail -2 /tmp/power.log | tr '\n' ' ')"
            fi
          else
            echo "=INFO p:server:bulk-power tidak tersedia"
          fi
          for i in 1 2 3 4 5 6; do
            sleep 5
            LINE="$(docker ps -a --format '{{.Names}}|{{.Status}}|{{.Ports}}' 2>/dev/null | grep -F "$UUID" | head -1)"
            [ -n "$LINE" ] && break
          done
          echo "=CONTAINER ${LINE:-belum-ada}"
          PORT="$(echo "${LINE:-}" | sed -n 's/.*:\([0-9]\{2,5\}\)->.*/\1/p' | head -1)"
          echo "=PORT ${PORT:-0}"
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*) n=$((n+1)); [ "$n" -le 10 ] && echo "::notice title=Start::${line#=}" ;;
            esac
          done <<< "$out" || true
          port="$(printf '%s\n' "$out" | sed -n 's/^=PORT \([0-9][0-9]*\)$/\1/p' | head -1)"
          if [ -n "$port" ] && [ "$port" != "0" ]; then
            code="$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "http://$VPS_HOST:$port/" 2>/dev/null || true)"
            echo "::notice title=HTTP::http://$VPS_HOST:$port/ -> ${code:-000}"
          fi
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi

  # ------------------------------------------------------------ web-setup ----
  web-setup:
    name: Pasang nginx (+ HTTPS) untuk domain
    if: inputs.tugas == 'web-setup'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
      DOMAIN: portofolio.xiero.biz.id
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Tulis vhost nginx (+ certbot bila konfirmasi SSL)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          KONFIRMASI: ${{ inputs.konfirmasi }}
        run: |
          set -uo pipefail
          ssl=0
          [ "$KONFIRMASI" = "SSL" ] && ssl=1
          out="$(bash deploy/gha-ssh.sh "bash -s -- $SERVER_ID $DOMAIN $ssl" <<'REMOTE' 2>&1
          set -u
          UUID="$1"; DOMAIN="$2"; SSL="$3"
          CONF="/etc/nginx/sites-available/$DOMAIN"
          BACKUP="/root/$DOMAIN-nginx-$(date +%Y%m%d-%H%M).bak"
          NAME="$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep -F "$UUID" | head -1)"
          if [ -z "$NAME" ]; then echo "=GAGAL container server tidak ada"; exit 1; fi
          PORT="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$NAME" 2>/dev/null | sed -n 's/^SERVER_PORT=//p' | head -1)"
          echo "=PORT ${PORT:-?}"
          if [ -z "$PORT" ]; then echo "=GAGAL port alokasi tidak diketahui"; exit 1; fi
          if [ -f "$CONF" ]; then cp -a "$CONF" "$BACKUP" && echo "=OK backup $BACKUP"; fi
          cat > "$CONF" <<NGINX
          server {
              listen 80;
              listen [::]:80;
              server_name $DOMAIN;

              client_max_body_size 60M;

              location / {
                  proxy_pass http://127.0.0.1:$PORT;
                  proxy_http_version 1.1;
                  proxy_set_header Host              \$host;
                  proxy_set_header X-Real-IP         \$remote_addr;
                  proxy_set_header X-Forwarded-For   \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 120s;
                  proxy_buffering off;
              }
          }
          NGINX
          ln -sf "$CONF" "/etc/nginx/sites-enabled/$DOMAIN"
          if nginx -t 2>/tmp/ngx.err; then
            systemctl reload nginx && echo "=OK nginx reload (proxy ke 127.0.0.1:$PORT)"
          else
            echo "=GAGAL nginx -t: $(tail -2 /tmp/ngx.err | tr '\n' ' ')"
            rm -f "/etc/nginx/sites-enabled/$DOMAIN"
            [ -f "$BACKUP" ] && cp -a "$BACKUP" "$CONF"
            nginx -t >/dev/null 2>&1 && systemctl reload nginx
            exit 1
          fi
          ENVF="/var/lib/pterodactyl/volumes/$UUID/.env"
          if [ -f "$ENVF" ]; then
            if grep -q '^TRUST_PROXY=' "$ENVF"; then
              sed -i 's/^TRUST_PROXY=.*/TRUST_PROXY=true/' "$ENVF"
            else
              echo 'TRUST_PROXY=true' >> "$ENVF"
            fi
            echo "=OK .env TRUST_PROXY=true"
          else
            echo "=INFO .env belum ada (dibuat saat Start pertama)"
          fi
          if [ "$SSL" = "1" ]; then
            if command -v certbot >/dev/null 2>&1; then
              if certbot --nginx -d "$DOMAIN" --redirect --agree-tos \
                   --register-unsafely-without-email --non-interactive >/tmp/certbot.log 2>&1; then
                echo "=OK sertifikat HTTPS terpasang"
              else
                echo "=GAGAL certbot: $(tail -3 /tmp/certbot.log | tr '\n' ' ')"
              fi
            else
              echo "=INFO certbot tidak terpasang (jalankan: apt install -y certbot python3-certbot-nginx)"
            fi
          else
            echo "=INFO certbot dilewati (jalankan ulang dengan konfirmasi SSL)"
          fi
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*) n=$((n+1)); [ "$n" -le 12 ] && echo "::notice title=Web::${line#=}" ;;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # ---------------------------------------------------------- fix-startup ----
  fix-startup:
    name: Perbaiki startup command (DB) & restart Wings
    if: inputs.tugas == 'fix-startup'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Ubah startup command & sinkronkan Wings
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $SERVER_ID" <<'REMOTE' 2>&1
          set -u
          UUID="$1"
          if [ ! -f /var/www/pterodactyl/.env ]; then echo "=GAGAL .env panel tidak ada"; exit 1; fi
          PHPBIN="$(command -v php || command -v php8.3 || command -v php8.2 || true)"
          if [ -z "$PHPBIN" ]; then echo "=GAGAL php CLI tidak ada"; exit 1; fi
          echo "=PHPBIN $PHPBIN"
          cat > /tmp/fix-startup.php <<'PHP'
          <?php
          // Parser .env manual: menangani tanda kutip, spasi, dan karakter khusus.
          $env = [];
          foreach (file('/var/www/pterodactyl/.env', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {
              if (!preg_match('/^\s*([A-Za-z0-9_]+)\s*=\s*(.*)$/', $line, $m)) { continue; }
              $v = trim($m[2]);
              $len = strlen($v);
              if ($len >= 2 && (($v[0] === '"' && $v[$len-1] === '"') || ($v[0] === "'" && $v[$len-1] === "'"))) {
                  $v = substr($v, 1, -1);
              }
              $env[$m[1]] = $v;
          }
          echo "=ENVKEYS " . implode(',', array_intersect(array_keys($env), ['DB_HOST','DB_PORT','DB_DATABASE','DB_USERNAME','DB_PASSWORD'])) . "\n";
          echo "=PWLEN " . strlen($env['DB_PASSWORD'] ?? '') . "\n";
          $host = $env['DB_HOST'] ?? '127.0.0.1';
          if (in_array($host, ['localhost', '127.0.0.1'], true)) { $host = '127.0.0.1'; }
          $dsn = sprintf('mysql:host=%s;port=%s;dbname=%s', $host, $env['DB_PORT'] ?? '3306', $env['DB_DATABASE'] ?? 'panel');
          try {
              $pdo = new PDO($dsn, $env['DB_USERNAME'] ?? 'pterodactyl', $env['DB_PASSWORD'] ?? '', [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          } catch (Throwable $e) {
              echo "=GAGAL koneksi DB: " . $e->getMessage() . "\n";
              exit(2);
          }
          $uuid = $argv[1];
          $stmt = $pdo->prepare('SELECT id, startup, image FROM servers WHERE uuid = ?');
          $stmt->execute([$uuid]);
          $row = $stmt->fetch(PDO::FETCH_ASSOC);
          if (!$row) { echo "=GAGAL server tidak ada di DB\n"; exit(3); }
          echo "=SEBELUM " . $row['startup'] . "\n";
          echo "=IMAGE " . $row['image'] . "\n";
          file_put_contents('/root/portofolio-startup-backup.txt', date('c') . ' ' . json_encode($row) . "\n", FILE_APPEND);
          $upd = $pdo->prepare('UPDATE servers SET startup = ? WHERE id = ?');
          $upd->execute(['sh start.sh', $row['id']]);
          $stmt->execute([$uuid]);
          $row2 = $stmt->fetch(PDO::FETCH_ASSOC);
          echo "=SESUDAH " . $row2['startup'] . "\n";
          PHP
          "$PHPBIN" /tmp/fix-startup.php "$UUID" || exit 1
          systemctl restart wings
          for i in 1 2 3 4 5 6 7 8; do sleep 3; [ "$(systemctl is-active wings)" = "active" ] && break; done
          echo "=WINGS $(systemctl is-active wings)"
          cd /var/www/pterodactyl || exit 1
          "$PHPBIN" artisan p:server:bulk-power --help 2>&1 | sed -n '3,8p' | sed 's/^/=HELP /'
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*) n=$((n+1)); [ "$n" -le 12 ] && echo "::notice title=Fix::${line#=}" ;;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # --------------------------------------------------------- start-server ----
  start-server:
    name: Nyalakan server lewat panel
    if: inputs.tugas == 'start-server'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID || '2ed93f7b-4009-4eaa-814c-577dee40dd3b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Kirim perintah start & cek hasil
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $SERVER_ID" <<'REMOTE' 2>&1
          set -u
          UUID="$1"
          cd /var/www/pterodactyl || { echo "=GAGAL panel dir"; exit 1; }
          PHPBIN="$(command -v php || true)"
          echo "=HELP $("$PHPBIN" artisan p:server:bulk-power --help 2>&1 | grep -E 'servers|action|Usage' | head -4 | tr '\n' '|')"
          for variant in "--servers=$UUID" "--server=$UUID" ""; do
            if "$PHPBIN" artisan p:server:bulk-power start $variant -n >/tmp/power.log 2>&1; then
              echo "=OK start variant='${variant:-(interaktif)}'"
              break
            fi
          done
          sleep 25
          LINE="$(docker ps -a --format '{{.Names}}|{{.Status}}' 2>/dev/null | grep -F "$UUID" | head -1)"
          echo "=CONTAINER ${LINE:-belum-ada}"
          if [ -n "${LINE:-}" ]; then
            NAME="${LINE%%|*}"
            docker logs --tail 20 "$NAME" 2>&1 | grep -v '^$' | tail -4 | sed 's/^/=LOG /'
          fi
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =*) n=$((n+1)); [ "$n" -le 12 ] && echo "::notice title=Start::${line#=}" ;;
            esac
          done <<< "$out" || true
          exit 0

  # ---------------------------------------------------------------- smoke ----
  smoke:
    name: Uji halaman publik & admin
    if: inputs.tugas == 'smoke'
    runs-on: ubuntu-latest
    env:
      BASE: https://portofolio.xiero.biz.id
    steps:
      - name: Beranda (200)
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$BASE/" 2>/dev/null || true)"
          echo "::notice title=Beranda::HTTP ${code:-000}"
          [ "${code:-000}" = "200" ]

      - name: /login (200)
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$BASE/login" 2>/dev/null || true)"
          echo "::notice title=Login::HTTP ${code:-000}"
          [ "${code:-000}" = "200" ]

      - name: /admin tanpa sesi (302 ke login)
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$BASE/admin" 2>/dev/null || true)"
          echo "::notice title=Admin::HTTP ${code:-000}"
          [ "${code:-000}" = "302" ]

      - name: /blog (200)
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$BASE/blog" 2>/dev/null || true)"
          echo "::notice title=Blog::HTTP ${code:-000}"
          [ "${code:-000}" = "200" ]

      - name: /sitemap.xml & /feed.xml (200)
        run: |
          for path in /sitemap.xml /feed.xml /robots.txt; do
            code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$BASE$path" 2>/dev/null || true)"
            echo "::notice title=$path::HTTP ${code:-000}"
            [ "${code:-000}" = "200" ] || exit 1
          done

      - name: HTTP diarahkan ke HTTPS
        run: |
          code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' http://portofolio.xiero.biz.id/ 2>/dev/null || true)"
          echo "::notice title=Redirect::HTTP ${code:-000}"
          case "${code:-000}" in 301|302|308) exit 0 ;; *) exit 1 ;; esac

  # ------------------------------------------------------------------ bkp ----
  bkp:
    name: Daftar backup panel (baca saja)
    if: inputs.tugas == 'bkp'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Daftar folder backup
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          DIR=/var/lib/pterodactyl/backups
          if [ ! -d "$DIR" ]; then echo "=GAGAL folder backup tidak ada"; exit 1; fi
          echo "=TOTAL $(du -sh "$DIR" 2>/dev/null | cut -f1)"
          echo "=ISIDIR $(ls -A "$DIR" 2>/dev/null | wc -l) entri"
          echo "=DF $(df -h "$DIR" | awk 'NR==2{print $2" total, "$3" pakai, "$4" sisa"}')"
          du -h -d1 "$DIR" 2>/dev/null | sort -rh | head -8 | sed "s|$DIR|.|" | sed 's/^/=BESAR /'
          ls -la "$DIR" 2>/dev/null | head -8 | sed 's/^/=LS /'
          REMOTE
          )" || true
          echo "$out"
          n=0
          while IFS= read -r line; do
            case "$line" in
              =BKP*) echo "::notice title=Backup::${line#=BKP }" ;;
              =BESAR*) echo "::notice title=Ukuran::${line#=BESAR }" ;;
              =LS*) echo "::notice title=LS::${line#=LS }" ;;
              =TOTAL*) echo "::notice title=Total::${line#=TOTAL }" ;;
              =DF*) echo "::notice title=Disk::${line#=DF }" ;;
              =ISIDIR*) echo "::notice title=Isi::${line#=ISIDIR }" ;;
            esac
          done <<< "$out" || true
          exit 0

      - name: Berkas backup besar (di luar folder)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          DIR=/var/lib/pterodactyl/backups
          find "$DIR" -maxdepth 1 -type f -printf '%s|%TY-%Tm-%Td|%f\n' 2>/dev/null | sort -rn | head -12 | sed 's/^/=FILE /'
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =FILE*)
                data="${line#=FILE }"
                printf '%s\n' "$data" | awk -F'|' '{printf "::notice title=Berkas::%.0f MB | %s | %s\n", $1/1048576, $2, $3}'
                ;;
            esac
          done <<< "$out" || true
          exit 0

  # ------------------------------------------------------------ bkp-hapus ----
  bkp-hapus:
    name: Rapikan backup (simpan terbaru per server)
    if: inputs.tugas == 'bkp-hapus'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      MODE: ${{ startsWith(inputs.konfirmasi, 'HAPUS') && 'hapus' || 'laporan' }}
      SIMPAN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Hitung & hapus backup lama per server
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $MODE $SIMPAN" <<'REMOTE' 2>&1
          set -u
          MODE="$1"; KEEP="$2"
          PHPBIN="$(command -v php || true)"
          [ -n "$PHPBIN" ] || { echo "=GAGAL php CLI tidak ada"; exit 1; }
          echo "=AWAL $(du -sh /var/lib/pterodactyl/backups 2>/dev/null | cut -f1)"
          cat > /tmp/rapibackup.php <<'PHP'
          <?php
          $mode = $argv[1] ?? 'laporan';
          $keep = max(0, (int) ($argv[2] ?? 1));
          $dir  = '/var/lib/pterodactyl/backups';
          $env = [];
          foreach (file('/var/www/pterodactyl/.env', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {
              if (!preg_match('/^\s*([A-Za-z0-9_]+)\s*=\s*(.*)$/', $line, $m)) { continue; }
              $v = trim($m[2]); $len = strlen($v);
              if ($len >= 2 && (($v[0] === '"' && $v[$len-1] === '"') || ($v[0] === "'" && $v[$len-1] === "'"))) { $v = substr($v, 1, -1); }
              $env[$m[1]] = $v;
          }
          $host = $env['DB_HOST'] ?? '127.0.0.1';
          if (in_array($host, ['localhost', '127.0.0.1'], true)) { $host = '127.0.0.1'; }
          $map = [];
          try {
              $pdo = new PDO(sprintf('mysql:host=%s;port=%s;dbname=%s', $host, $env['DB_PORT'] ?? '3306', $env['DB_DATABASE'] ?? 'panel'),
                             $env['DB_USERNAME'] ?? 'pterodactyl', $env['DB_PASSWORD'] ?? '',
                             [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              foreach ($pdo->query('SELECT b.uuid, s.name AS server FROM backups b LEFT JOIN servers s ON s.id = b.server_id') as $r) {
                  $map[$r['uuid']] = $r['server'] ?: 'server-terhapus';
              }
          } catch (Throwable $e) {
              echo "=GAGAL DB: " . $e->getMessage() . "\n";
              exit(2);
          }
          $files = array_merge(glob("$dir/*.tar.gz") ?: [], glob("$dir/*.tar") ?: []);
          $groups = [];
          foreach ($files as $f) {
              $uuid = preg_replace('/\.tar(\.gz)?$/', '', basename($f));
              $server = $map[$uuid] ?? 'di-luar-panel';
              $groups[$server][] = ['f' => $f, 't' => filemtime($f), 's' => filesize($f)];
          }
          $del = 0; $bytes = 0; $shown = 0; $saved = 0;
          foreach ($groups as $server => $items) {
              usort($items, fn ($a, $b) => $b['t'] <=> $a['t']);
              $n = count($items);
              $saved += min($keep, $n);
              $cut = 0; $mb = 0;
              if ($server === 'di-luar-panel') {
                  // Berkas yang tidak tercatat di panel tidak dihapus otomatis.
                  $luar = 0; $luarMb = 0;
                  foreach ($items as $it) { $luar++; $luarMb += $it['s']; }
                  printf("=LUAR %d berkas tidak tercatat di panel|%d MB (tidak dihapus)\n", $luar, (int) round($luarMb / 1048576));
                  $saved += $luar;
                  continue;
              }
              foreach ($items as $i => $it) {
                  if ($i < $keep) { continue; }
                  $cut++; $mb += $it['s'];
                  if ($mode === 'hapus') { @unlink($it['f']); }
              }
              if ($cut > 0) {
                  $del += $cut; $bytes += $mb;
                  if ($shown < 9) {
                      printf("=SERVER %s|hapus %d berkas|%d MB\n", $server, $cut, (int) round($mb / 1048576));
                      $shown++;
                  }
              }
          }
          printf("=TOTAL %d berkas dihapus/ditandai, %d MB\n", $del, (int) round($bytes / 1048576));
          printf("=TERSISA %d berkas backup dipertahankan\n", $saved);
          PHP
          "$PHPBIN" /tmp/rapibackup.php "$MODE" "$KEEP" || exit 1
          echo "=AKHIR $(du -sh /var/lib/pterodactyl/backups 2>/dev/null | cut -f1)"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =SERVER*|=TOTAL*|=TERSISA*|=LUAR*) echo "::notice title=Backup::${line#=}";;
              =AWAL*|=AKHIR*) echo "::notice title=Info::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # -------------------------------------------------------- bkp-luar-hapus ----
  bkp-luar-hapus:
    name: Hapus arsip backup di luar panel
    if: inputs.tugas == 'bkp-luar-hapus'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      MODE: ${{ startsWith(inputs.konfirmasi, 'HAPUS') && 'hapus' || 'laporan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Hapus arsip yang tidak tercatat di panel
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $MODE" <<'REMOTE' 2>&1
          set -u
          MODE="$1"
          PHPBIN="$(command -v php || true)"
          [ -n "$PHPBIN" ] || { echo "=GAGAL php CLI tidak ada"; exit 1; }
          cat > /tmp/luar.php <<'PHP'
          <?php
          $mode = $argv[1] ?? 'laporan';
          $dir  = '/var/lib/pterodactyl/backups';
          $env = [];
          foreach (file('/var/www/pterodactyl/.env', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {
              if (strpos($line, '=') === false || strpos(ltrim($line), '#') === 0) { continue; }
              [$k, $v] = explode('=', $line, 2);
              $k = trim($k); $v = trim($v);
              if (strlen($v) >= 2 && ($v[0] === chr(34) || $v[0] === chr(39))) { $v = substr($v, 1, -1); }
              $env[$k] = $v;
          }
          $host = $env['DB_HOST'] ?? '127.0.0.1';
          if (in_array($host, ['localhost', '127.0.0.1'], true)) { $host = '127.0.0.1'; }
          try {
              $pdo = new PDO(sprintf('mysql:host=%s;port=%s;dbname=%s', $host, $env['DB_PORT'] ?? '3306', $env['DB_DATABASE'] ?? 'panel'),
                             $env['DB_USERNAME'] ?? 'pterodactyl', $env['DB_PASSWORD'] ?? '',
                             [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          } catch (Throwable $e) {
              echo "=GAGAL DB: " . $e->getMessage() . "\n";
              exit(2);
          }
          $ada = [];
          foreach ($pdo->query('SELECT uuid FROM backups') as $r) { $ada[$r['uuid']] = true; }
          $files = array_merge(glob("$dir/*.tar.gz") ?: [], glob("$dir/*.tar") ?: []);
          $n = 0; $bytes = 0; $daftar = '';
          foreach ($files as $f) {
              if (!is_file($f)) { continue; }
              $u = str_replace(['.tar.gz', '.tar'], '', basename($f));
              if (isset($ada[$u])) { continue; }
              $n++; $bytes += filesize($f);
              $daftar .= basename($f) . "\n";
              if ($n <= 8) { printf("=FILE %.1fMB|%s\n", filesize($f) / 1048576, basename($f)); }
              if ($mode === 'hapus') { @unlink($f); }
          }
          file_put_contents('/root/backup-luar-panel-' . date('Y-m-d') . '.txt', $daftar, FILE_APPEND);
          printf("=TOTAL %d berkas|%d MB|mode=%s\n", $n, (int) round($bytes / 1048576), $mode);
          echo "=CATATAN /root/backup-luar-panel-" . date('Y-m-d') . ".txt\n";
          PHP
          echo "=AWAL $(du -sh /var/lib/pterodactyl/backups 2>/dev/null | cut -f1)"
          "$PHPBIN" /tmp/luar.php "$MODE" || exit 1
          echo "=AKHIR $(du -sh /var/lib/pterodactyl/backups 2>/dev/null | cut -f1)"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =FILE*|=TOTAL*|=CATATAN*) echo "::notice title=Arsip::${line#=}";;
              =AWAL*|=AKHIR*) echo "::notice title=Info::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # ----------------------------------------------------------- kredensial ----
  kredensial:
    name: Info kredensial login owner
    if: inputs.tugas == 'kredensial'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Bacakan OWNER_EMAIL / pola password (password utuh tidak dicetak)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          DIR="/var/lib/pterodactyl/volumes/2ed93f7b-4009-4eaa-814c-577dee40dd3b"
          [ -d "$DIR" ] || DIR="$(ls -d /var/lib/pterodactyl/volumes/*/ 2>/dev/null | head -n 1)"
          echo "=DIR $DIR"
          if [ ! -f "$DIR/.env" ]; then echo "=GAGAL .env tidak ada"; exit 1; fi
          EMAIL="$(grep -E '^OWNER_EMAIL=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r')"
          PASS="$(grep -E '^OWNER_PASSWORD=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r')"
          echo "=EMAIL ${EMAIL:-<kosong>}"
          echo "=PWPANJANG ${#PASS}"
          echo "=PWPOLA $(echo "$PASS" | sed -E 's/^(....).*([^ ])$/\1****\2/')"
          DBN="$DIR/storage/database.sqlite"
          echo "=DBPATH $DBN|ada=$([ -f "$DBN" ] && echo ya || echo tidak)"
          if [ -f "$DBN" ]; then
            PHPBIN="$(command -v php || true)"
            echo "=PHPBIN ${PHPBIN:-<tidak-ada>}"
            if [ -n "$PHPBIN" ]; then
              "$PHPBIN" -r '
                $db = new PDO("sqlite:" . $argv[1]);
                $pass = $argv[2];
                foreach ($db->query("SELECT email, role, is_active FROM users") as $u) {
                    $ok = "?";
                    $q = $db->prepare("SELECT password_hash FROM users WHERE email = ?");
                    $q->execute([$u["email"]]);
                    $h = $q->fetchColumn();
                    if (is_string($h)) { $ok = password_verify($pass, $h) ? "cocok .env" : "beda dari .env"; }
                    printf("=AKUN %s|role=%s|aktif=%s|%s\n", $u["email"], $u["role"], $u["is_active"], $ok);
                }
              ' "$DBN" "$PASS" 2>&1 | head -6
            fi
          else
            echo "=CATATAN database.sqlite tidak ditemukan"
          fi
          # Uji kredensial langsung ke situs (tanpa mencetak password).
          BASE="https://portofolio.xiero.biz.id"
          JAR="$(mktemp)"
          TOKEN="$(curl -fsS -c "$JAR" "$BASE/login" 2>/dev/null | grep -o 'name="_token" value="[^"]*"' | head -n 1 | sed -E 's/.*value="//; s/"$//')"
          if [ -n "$TOKEN" ]; then
            HDR="$(mktemp)"
            CODE="$(curl -s -o /dev/null -D "$HDR" -w '%{http_code}' -b "$JAR" -c "$JAR" -X POST "$BASE/login" \
              --data-urlencode "_token=$TOKEN" --data-urlencode "email=$EMAIL" --data-urlencode "password=$PASS")"
            LOC="$(grep -i '^location:' "$HDR" | tail -n 1 | tr -d '\r' | sed -E 's/^[Ll]ocation: *//')"
            rm -f "$HDR"
            ADMIN="$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/admin")"
            echo "=LOGIN POST=$CODE tujuan=${LOC:-<kosong>} lalu-/admin=$ADMIN"
          else
            echo "=LOGIN tidak bisa ambil token CSRF"
          fi
          rm -f "$JAR"
          mkdir -p /root
          printf "EMAIL: %s\nPASSWORD: %s\nSumber: %s/.env\n" "$EMAIL" "$PASS" "$DIR" > /root/kredensial-portofolio.txt
          chmod 600 /root/kredensial-portofolio.txt
          echo "=BERKAS /root/kredensial-portofolio.txt (chmod 600)"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =EMAIL*|=PWPANJANG*|=PWPOLA*|=DIR*) echo "::notice title=Kredensial::${line#=}";;
              =AKUN*) echo "::notice title=Akun::${line#=}";;
              =LOGIN*) echo "::notice title=Uji login::${line#=}";;
              =DBPATH*|=PHPBIN*) echo "::notice title=DB::${line#=}";;
              =BERKAS*|=CATATAN*) echo "::notice title=Info::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # ---------------------------------------------------------------- akun ----
  akun:
    name: Daftar akun di database aplikasi
    if: inputs.tugas == 'akun'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Baca tabel users (email disamarkan)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          CID="$(docker ps -q --filter name=2ed93f7b 2>/dev/null | head -n 1)"
          if [ -z "$CID" ]; then echo "=GAGAL container server tidak jalan"; exit 1; fi
          echo "=CONTAINER ${CID:0:12}"
          docker exec "$CID" php -r '
            $path = "storage/database.sqlite";
            if (!file_exists($path)) { echo "=GAGAL database.sqlite tidak ada\n"; exit(1); }
            try {
                $db = new PDO("sqlite:" . $path);
                $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
            } catch (Throwable $e) {
                echo "=GAGAL " . $e->getMessage() . "\n"; exit(2);
            }
            $cols = [];
            foreach ($db->query("PRAGMA table_info(users)") as $c) { $cols[$c["name"]] = true; }
            $has2fa = isset($cols["totp_enabled_at"]);
            $sql = "SELECT id, email, role, is_active, updated_at" . ($has2fa ? ", totp_enabled_at" : "") . " FROM users ORDER BY id";
            $n = 0;
            foreach ($db->query($sql) as $u) {
                $n++;
                $mask = substr($u["email"], 0, 3) . "***" . strstr($u["email"], "@");
                $fa = $has2fa ? (trim((string) $u["totp_enabled_at"]) !== "" ? "2fa=aktif" : "2fa=tidak") : "2fa=?";
                printf("=USER #%d %s|%s|aktif=%s|%s|diubah=%s\n", $u["id"], $mask, $u["role"], $u["is_active"], $fa, $u["updated_at"]);
            }
            echo "=JUMLAH " . $n . " akun\n";
          ' 2>&1 | head -20
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =USER*|=JUMLAH*|=CONTAINER*) echo "::notice title=Akun::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          exit 0

  # ----------------------------------------------------------- akun-ubah ----
  akun-ubah:
    name: Samakan akun owner dengan .env
    if: inputs.tugas == 'akun-ubah'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      MODE: ${{ startsWith(inputs.konfirmasi, 'UBAH') && 'ubah' || 'laporan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Selaraskan email & hash password owner, lalu uji login
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh "bash -s -- $MODE" <<'REMOTE' 2>&1
          set -u
          MODE="$1"
          DIR="/var/lib/pterodactyl/volumes/2ed93f7b-4009-4eaa-814c-577dee40dd3b"
          CID="$(docker ps -q --filter name=2ed93f7b 2>/dev/null | head -n 1)"
          [ -n "$CID" ] || { echo "=GAGAL container server tidak jalan"; exit 1; }
          cat > /tmp/akun-ubah.php <<'PHP'
          <?php
          $mode = $argv[1] ?? 'laporan';
          $env = [];
          foreach (file('/home/container/.env', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {
              if (strpos($line, '=') === false || strpos(ltrim($line), '#') === 0) { continue; }
              [$k, $v] = explode('=', $line, 2);
              $k = trim($k); $v = trim($v);
              if (strlen($v) >= 2 && ($v[0] === chr(34) || $v[0] === chr(39))) { $v = substr($v, 1, -1); }
              $env[$k] = $v;
          }
          $pw = $env['OWNER_PASSWORD'] ?? '';
          $em = strtolower(trim($env['OWNER_EMAIL'] ?? ''));
          if (strlen($pw) < 8) { echo "=GAGAL OWNER_PASSWORD di .env kosong / kurang dari 8 karakter\n"; exit(1); }
          if (!filter_var($em, FILTER_VALIDATE_EMAIL)) { echo "=GAGAL OWNER_EMAIL di .env tidak valid\n"; exit(1); }
          try {
              $db = new PDO('sqlite:/home/container/storage/database.sqlite', null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          } catch (Throwable $e) {
              echo "=GAGAL DB: " . $e->getMessage() . "\n"; exit(2);
          }
          $user = $db->query("SELECT id, email, role FROM users ORDER BY (role = 'owner') DESC, id LIMIT 1")->fetch(PDO::FETCH_ASSOC);
          if (!$user) { echo "=GAGAL tabel users kosong\n"; exit(2); }
          $mask = static fn (string $e): string => substr($e, 0, 3) . '***' . (string) strstr($e, '@');
          printf("=RENCANA id=%d|email %s -> %s|hash dari OWNER_PASSWORD .env\n", $user['id'], $mask($user['email']), $em);
          if ($mode !== 'ubah') { echo "=MODE laporan (tidak ada perubahan)\n"; exit(0); }
          try {
              $db->beginTransaction();
              $stmt = $db->prepare('UPDATE users SET email = ?, password_hash = ?, updated_at = ? WHERE id = ?');
              $stmt->execute([$em, password_hash($pw, PASSWORD_DEFAULT), date('Y-m-d H:i:s'), $user['id']]);
              $rows = $stmt->rowCount();
              try { $db->exec('DELETE FROM login_attempts'); } catch (Throwable $e) { }
              $db->commit();
          } catch (Throwable $e) {
              if ($db->inTransaction()) { $db->rollBack(); }
              echo "=GAGAL update: " . $e->getMessage() . "\n"; exit(3);
          }
          printf("=UBAH berhasil|baris=%d|email=%s|pola=%s****%s|panjang=%d\n", $rows, $em, substr($pw, 0, 4), substr($pw, -1), strlen($pw));
          PHP
          # rootfs container read-only -> skrip ditaruh sementara di volume (ekstensi .txt,
          # jadi tidak pernah dieksekusi oleh web server), lalu dihapus.
          cp /tmp/akun-ubah.php "$DIR/.akun-ubah.txt"
          out2="$(docker exec "$CID" php /home/container/.akun-ubah.txt "$MODE" 2>&1)"; rc2=$?
          rm -f "$DIR/.akun-ubah.txt"
          echo "=EXEC rc=$rc2 skrip-hapus=$( [ -f "$DIR/.akun-ubah.txt" ] && echo belum || echo ya )"
          echo "$out2" | head -12 | sed 's/^/=OUT /'
          EM="$(grep -E '^OWNER_EMAIL=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r"')"
          PW="$(grep -E '^OWNER_PASSWORD=' "$DIR/.env" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r"')"
          BASE="https://portofolio.xiero.biz.id"
          JAR="$(mktemp)"
          TOKEN="$(curl -fsS -c "$JAR" "$BASE/login" 2>/dev/null | grep -o 'name="_token" value="[^"]*"' | head -n 1 | sed -E 's/.*value="//; s/"$//')"
          if [ -n "$TOKEN" ]; then
            HDR="$(mktemp)"
            curl -s -o /dev/null -D "$HDR" -b "$JAR" -c "$JAR" -X POST "$BASE/login" \
              --data-urlencode "_token=$TOKEN" --data-urlencode "email=$EM" --data-urlencode "password=$PW" || true
            LOC="$(grep -i '^location:' "$HDR" | tail -n 1 | tr -d '\r' | sed -E 's/^[Ll]ocation: *//')"
            rm -f "$HDR"
            ADMIN="$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/admin")"
            PROFIL="$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/profil")"
            echo "=LOGIN email=$EM|tujuan=${LOC:-<kosong>}|/admin=$ADMIN|/profil=$PROFIL"
          else
            echo "=LOGIN token CSRF tidak ditemukan"
          fi
          rm -f "$JAR"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =RENCANA*|=UBAH*) echo "::notice title=Akun::${line#=}";;
              =LOGIN*) echo "::notice title=Uji login::${line#=}";;
              =MODE*) echo "::notice title=Info::${line#=}";;
              =EXEC*|=OUT*) echo "::notice title=Debug::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          if echo "$out" | grep -q '^=GAGAL'; then exit 1; fi
          exit 0

  # ------------------------------------------------------------ diagnosa ----
  diagnosa:
    name: Diagnosa upload & storage
    if: inputs.tugas == 'diagnosa'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '38.47.92.214' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi kredensial SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "::error title=Kredensial belum ada::Tambahkan secret VPS_SSH_PASSWORD (atau VPS_SSH_KEY)"
            exit 1
          fi

      - name: Kumpulkan info container
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          out="$(bash deploy/gha-ssh.sh 'bash -s' <<'REMOTE' 2>&1
          set -u
          DIR="/var/lib/pterodactyl/volumes/2ed93f7b-4009-4eaa-814c-577dee40dd3b"
          CID="$(docker ps -q --filter name=2ed93f7b 2>/dev/null | head -n 1)"
          [ -n "$CID" ] || { echo "=GAGAL container tidak jalan"; exit 1; }
          echo "=INI $(docker exec "$CID" php -r 'echo "upload=".ini_get("upload_max_filesize")." post=".ini_get("post_max_size")." maxfiles=".ini_get("max_file_uploads")." file_uploads=".ini_get("file_uploads")." mem=".ini_get("memory_limit");' 2>&1 | head -1)"
          echo "=EXT $(docker exec "$CID" php -r 'echo "gd=".(function_exists("imagecreatefromstring")?"ya":"tidak")." webp=".(function_exists("imagewebp")?"ya":"tidak")." finfo=".(class_exists("finfo")?"ya":"tidak")." sqlite=".(in_array("sqlite", PDO::getAvailableDrivers())?"ya":"tidak");' 2>&1 | head -1)"
          echo "=IZIN $(docker exec "$CID" sh -c 'for d in storage storage/uploads storage/documents storage/releases; do printf "%s=%s " "$d" "$([ -w "$d" ] && echo rw || echo RO)"; done; echo; id -u  2>/dev/null' 2>&1 | head -1)"
          echo "=ENVLIMIT $(grep -E "^(MAX_UPLOAD_MB|CV_MAX_MB|RELEASE_MAX_MB|BACKUP_MAX_MB|APP_MAX_MB)=" "$DIR/.env" | tr "\n" " ")"
          echo "=JUMLAH $(docker exec "$CID" sh -c 'printf "uploads=%s dokumen=%s rilis=%s\n" "$(ls -1 storage/uploads 2>/dev/null | wc -l)" "$(ls -1 storage/documents 2>/dev/null | wc -l)" "$(ls -1 storage/releases 2>/dev/null | wc -l)"' 2>&1 | head -1)"
          echo "=OWNER $(stat -c "%u:%g" "$DIR/storage/uploads" 2>/dev/null) app=$(docker exec "$CID" sh -c "id -u; id -g" 2>/dev/null | tr "\n" ":")"
          echo "=LOG $(docker exec "$CID" sh -c 'ls -1t storage/logs/*.log 0 2>/dev/null | head -1' 2>&1 | head -1)"
          echo "=TAIL $(docker logs --tail 400 "$CID" 2>&1 | grep -iE "upload|fatal|uncaught|error" | tail -4 | tr "\n" " | " | cut -c1-600)"
          echo "=PROSES $(docker exec "$CID" sh -c 'ps -eo args 2>/dev/null | grep "php -S" | grep -v grep | head -1' 2>&1 | cut -c1-400)"
          echo "=DB $(docker exec "$CID" php -r '$d=new PDO("sqlite:storage/database.sqlite"); $r=$d->query("SELECT id, avatar, cover FROM profiles LIMIT 1")->fetch(PDO::FETCH_ASSOC); echo $r ? "id=".$r["id"]." avatar=".($r["avatar"]?:"<kosong>")." cover=".($r["cover"]?:"<kosong>") : "TIDAK ADA BARIS profiles"; foreach ($d->query("SELECT setting_key, setting_value FROM settings WHERE setting_key LIKE \"cv%\" OR setting_key=\"site_title\"") as $x) { echo " | ".$x[0]."=".$x[1]; }' 2>&1 | head -2)"
          echo "=BERKAS $(docker exec "$CID" sh -c 'ls -1t storage/uploads 2>/dev/null | head -5' 2>&1 | tr "\n" " ")"
          REMOTE
          )" || true
          echo "$out"
          while IFS= read -r line; do
            case "$line" in
              =INI*|=EXT*|=IZIN*|=ENVLIMIT*|=JUMLAH*|=OWNER*|=LOG*|=TAIL*|=PROSES*|=DB*|=BERKAS*) echo "::notice title=Diagnosa::${line#=}";;
              =GAGAL*) echo "::error title=Gagal::${line#=GAGAL }";;
            esac
          done <<< "$out" || true
          exit 0

  # ---------------------------------------------------------- uji-upload ----
  uji-upload:
    name: Uji unggah gambar end-to-end
